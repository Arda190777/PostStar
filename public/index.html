<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostStar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f3f5;
      color: #333;
      min-height: 100vh;
    }

    nav {
      background: #1a1a2e;
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav .brand { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
    nav .brand span { color: #4361ee; }
    nav .nav-right { display: flex; gap: 10px; align-items: center; }
    nav .nav-right .nav-username { font-size: 0.88rem; opacity: 0.75; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.82; }
    .btn-primary   { background: #4361ee; color: #fff; }
    .btn-secondary { background: #e9ecef; color: #333; }
    .btn-danger    { background: #e63946; color: #fff; }
    .btn-sm        { padding: 4px 10px; font-size: 0.8rem; }

    main {
      max-width: 740px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      padding: 8px 20px;
      border-radius: 20px;
      border: 2px solid #4361ee;
      color: #4361ee;
      background: transparent;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .tab.active { background: #4361ee; color: #fff; }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .post-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 5px; }
    .post-meta  { font-size: 0.78rem; color: #888; margin-bottom: 10px; }
    .post-body  { font-size: 0.92rem; line-height: 1.6; color: #555; margin-bottom: 14px; }
    .post-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .like-count { font-size: 0.82rem; color: #4361ee; font-weight: 600; }
    .comments-toggle {
      background: none; border: none; color: #4361ee;
      font-size: 0.82rem; font-weight: 600; padding: 0;
      cursor: pointer; margin-left: auto;
    }

    .comments-section { margin-top: 14px; border-top: 1px solid #f0f0f0; padding-top: 12px; display: none; }
    .comments-section.open { display: block; }
    .comment-item { font-size: 0.85rem; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
    .comment-item:last-child { border-bottom: none; }
    .comment-author { font-weight: 600; margin-right: 6px; color: #333; }
    .comment-text { color: #555; }
    .comment-form { display: flex; gap: 8px; margin-top: 10px; }
    .comment-form input {
      flex: 1; padding: 7px 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 0.85rem;
    }

    .create-post-form {
      background: #fff; border-radius: 10px;
      padding: 18px 20px; margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .create-post-form h3 { font-size: 0.95rem; margin-bottom: 12px; color: #444; }
    .form-row { margin-bottom: 10px; }
    .form-row input, .form-row textarea {
      width: 100%; padding: 9px 12px;
      border: 1px solid #ddd; border-radius: 6px;
      font-size: 0.9rem; font-family: inherit; resize: vertical;
    }
    .form-row textarea { min-height: 80px; }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 200;
      align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 12px;
      padding: 28px 32px; width: 360px; max-width: 95vw;
    }
    .modal-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .modal-tab {
      flex: 1; padding: 8px; border-radius: 6px;
      border: 2px solid #4361ee; color: #4361ee;
      background: transparent; font-weight: 600; font-size: 0.88rem;
    }
    .modal-tab.active { background: #4361ee; color: #fff; }
    .modal-footer { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }
    .error-msg { color: #e63946; font-size: 0.82rem; margin-top: 8px; }

    .admin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 10px; padding: 16px 20px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .stat-card .stat-num { font-size: 2rem; font-weight: 700; color: #4361ee; }
    .stat-card .stat-label { font-size: 0.82rem; color: #888; margin-top: 4px; }

    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.88rem; }
    .user-row:last-child { border-bottom: none; }
    .user-info .user-name { font-weight: 600; }
    .user-info .user-role { font-size: 0.78rem; color: #888; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .badge-active  { background: #d4f8d4; color: #2d6a2d; }
    .badge-blocked { background: #fde8e8; color: #a00; }
    .badge-deleted { background: #eee;    color: #666; }

    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 0.9rem; }
    .empty   { text-align: center; padding: 30px; color: #aaa; font-size: 0.9rem; }

    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #333; color: #fff;
      padding: 10px 18px; border-radius: 8px;
      font-size: 0.88rem; z-index: 999; display: none;
      animation: fadeIn .2s;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; } }
  </style>
</head>
<body>

<nav>
  <span class="brand">Post<span>Star</span></span>
  <div class="nav-right">
    <span class="nav-username" id="nav-user"></span>
    <button class="btn-secondary btn-sm" id="btn-auth" onclick="openAuth()">Sign In</button>
    <button class="btn-danger btn-sm" id="btn-logout" style="display:none" onclick="logout()">Sign Out</button>
  </div>
</nav>

<main>
  <div class="tabs">
    <button class="tab active" onclick="showTab('posts', this)">Posts</button>
    <button class="tab" id="tab-admin" style="display:none" onclick="showTab('admin', this)">Admin</button>
  </div>

  <!-- POSTS -->
  <div id="view-posts">
    <div id="create-post-area" style="display:none">
      <div class="create-post-form">
        <h3>New Post</h3>
        <div class="form-row"><input type="text" id="post-title-input" placeholder="Title" /></div>
        <div class="form-row"><textarea id="post-body-input" placeholder="What's on your mind?"></textarea></div>
        <button class="btn-primary" onclick="createPost()">Publish</button>
      </div>
    </div>
    <div id="posts-list"><div class="loading">Loading posts...</div></div>
  </div>

  <!-- ADMIN -->
  <div id="view-admin" style="display:none">
    <div class="admin-grid" id="stats-grid">
      <div class="loading" style="grid-column:span 2">Loading stats...</div>
    </div>
    <div class="card">
      <h3 style="font-size:.95rem;margin-bottom:14px;color:#444">Users</h3>
      <div id="users-list"><div class="loading">Loading users...</div></div>
    </div>
  </div>
</main>

<!-- AUTH MODAL -->
<div class="overlay" id="auth-overlay" onclick="closeAuthIfBg(event)">
  <div class="modal">
    <div class="modal-tabs">
      <button class="modal-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
      <button class="modal-tab" id="tab-register" onclick="switchAuthTab('register')">Register</button>
    </div>

    <div id="auth-login">
      <div class="form-row"><input type="text" id="login-username" placeholder="Username" /></div>
      <div class="form-row" style="margin-top:10px"><input type="password" id="login-password" placeholder="Password" /></div>
      <div class="error-msg" id="login-error"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeAuth()">Cancel</button>
        <button class="btn-primary" onclick="login()">Sign In</button>
      </div>
    </div>

    <div id="auth-register" style="display:none">
      <div class="form-row"><input type="text" id="reg-username" placeholder="Username" /></div>
      <div class="form-row" style="margin-top:10px"><input type="password" id="reg-password" placeholder="Password (min. 6 chars)" /></div>
      <div class="error-msg" id="reg-error"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeAuth()">Cancel</button>
        <button class="btn-primary" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let token = localStorage.getItem('token') || null;
  let currentUser = JSON.parse(localStorage.getItem('user') || 'null');

  function toast(msg, ms = 2500) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
  }

  function showTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-posts').style.display = name === 'posts' ? '' : 'none';
    document.getElementById('view-admin').style.display = name === 'admin' ? '' : 'none';
    if (name === 'admin') loadAdmin();
  }

  function applyAuthState() {
    const in_ = !!token;
    document.getElementById('btn-auth').style.display = in_ ? 'none' : '';
    document.getElementById('btn-logout').style.display = in_ ? '' : 'none';
    document.getElementById('nav-user').textContent = in_ ? (currentUser?.username || '') : '';
    document.getElementById('create-post-area').style.display = in_ ? '' : 'none';
    const isAdmin = currentUser?.role === 'admin' || currentUser?.role === 'superuser';
    document.getElementById('tab-admin').style.display = isAdmin ? '' : 'none';
  }

  function openAuth() { document.getElementById('auth-overlay').classList.add('open'); }
  function closeAuth() { document.getElementById('auth-overlay').classList.remove('open'); }
  function closeAuthIfBg(e) { if (e.target === e.currentTarget) closeAuth(); }

  function switchAuthTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('auth-login').style.display    = isLogin ? '' : 'none';
    document.getElementById('auth-register').style.display = isLogin ? 'none' : '';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    document.getElementById('login-error').textContent = '';
    document.getElementById('reg-error').textContent = '';
  }

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body)  opts.body = JSON.stringify(body);
    const res  = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Something went wrong');
    return data;
  }

  async function login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    try {
      const data = await api('POST', '/auth/login', { username, password });
      token = data.token; currentUser = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(currentUser));
      closeAuth(); applyAuthState(); loadPosts();
      toast('Welcome back, ' + currentUser.username + '!');
    } catch (e) { document.getElementById('login-error').textContent = e.message; }
  }

  async function register() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    try {
      await api('POST', '/auth/register', { username, password });
      toast('Account created! You can now sign in.');
      switchAuthTab('login');
    } catch (e) { document.getElementById('reg-error').textContent = e.message; }
  }

  function logout() {
    token = null; currentUser = null;
    localStorage.removeItem('token'); localStorage.removeItem('user');
    applyAuthState(); loadPosts();
    toast('Signed out.');
  }

  async function loadPosts() {
    const list = document.getElementById('posts-list');
    list.innerHTML = '<div class="loading">Loading posts...</div>';
    try {
      const posts = await api('GET', '/posts');
      if (!posts.length) { list.innerHTML = '<div class="empty">No posts yet. Be the first!</div>'; return; }
      list.innerHTML = posts.map(renderPost).join('');
    } catch { list.innerHTML = '<div class="empty">Could not load posts.</div>'; }
  }

  function renderPost(p) {
    const isOwner = currentUser && currentUser.id === p.author?._id;
    const ownerBtns = isOwner ? `
      <button class="btn-secondary btn-sm" onclick="editPost('${p._id}',this)">Edit</button>
      <button class="btn-danger btn-sm" onclick="deletePost('${p._id}')">Delete</button>` : '';
    const likeBtn = token ? `<button class="btn-secondary btn-sm" onclick="likePost('${p._id}')">&#128077; Like</button>` : '';
    return `
      <div class="card" id="post-${p._id}">
        <div class="post-title">${esc(p.title)}</div>
        <div class="post-meta">${esc(p.author?.username || 'Unknown')} &middot; ${timeAgo(p.createdAt)}</div>
        <div class="post-body">${esc(p.body)}</div>
        <div class="post-actions">
          ${likeBtn}
          <span class="like-count">&#10084;&#65039; ${p.likeCount ?? 0}</span>
          ${ownerBtns}
          <button class="comments-toggle" onclick="toggleComments('${p._id}',this)">Comments &#9660;</button>
        </div>
        <div class="comments-section" id="comments-${p._id}">
          <div class="loading">Loading...</div>
        </div>
      </div>`;
  }

  async function createPost() {
    const title = document.getElementById('post-title-input').value.trim();
    const body  = document.getElementById('post-body-input').value.trim();
    if (!title || !body) { toast('Title and content are required.'); return; }
    try {
      await api('POST', '/posts', { title, body });
      document.getElementById('post-title-input').value = '';
      document.getElementById('post-body-input').value = '';
      toast('Post published!'); loadPosts();
    } catch (e) { toast(e.message); }
  }

  async function deletePost(id) {
    if (!confirm('Delete this post?')) return;
    try { await api('DELETE', '/posts/' + id); toast('Post deleted.'); loadPosts(); }
    catch (e) { toast(e.message); }
  }

  function editPost(id) {
    const card = document.getElementById('post-' + id);
    const newTitle = prompt('New title:', card.querySelector('.post-title').textContent);
    if (newTitle === null) return;
    const newBody = prompt('New content:', card.querySelector('.post-body').textContent);
    if (newBody === null) return;
    api('PUT', '/posts/' + id, { title: newTitle, body: newBody })
      .then(() => { toast('Post updated.'); loadPosts(); })
      .catch(e => toast(e.message));
  }

  async function toggleComments(postId, btn) {
    const section = document.getElementById('comments-' + postId);
    const open = section.classList.toggle('open');
    btn.innerHTML = open ? 'Comments &#9650;' : 'Comments &#9660;';
    if (open) await loadComments(postId);
  }

  async function loadComments(postId) {
    const section = document.getElementById('comments-' + postId);
    section.innerHTML = '<div class="loading">Loading...</div>';
    try {
      const comments = await api('GET', '/posts/' + postId + '/comments');
      const addForm = token ? `
        <div class="comment-form">
          <input type="text" id="ci-${postId}" placeholder="Write a comment..." />
          <button class="btn-primary btn-sm" onclick="addComment('${postId}')">Send</button>
        </div>` : '';
      if (!comments.length) {
        section.innerHTML = '<div class="empty" style="padding:10px 0;font-size:.85rem">No comments yet.</div>' + addForm;
        return;
      }
      const items = comments.map(c => {
        const isOwner = currentUser && currentUser.id === c.author?._id;
        const del = isOwner
          ? `<button class="btn-danger btn-sm" style="margin-left:8px" onclick="deleteComment('${postId}','${c._id}')">Delete</button>` : '';
        return `<div class="comment-item">
          <span class="comment-author">${esc(c.author?.username || '?')}</span>
          <span class="comment-text">${esc(c.text)}</span>${del}
        </div>`;
      }).join('');
      section.innerHTML = items + addForm;
    } catch { section.innerHTML = '<div class="empty">Could not load comments.</div>'; }
  }

  async function addComment(postId) {
    const input = document.getElementById('ci-' + postId);
    const text = input.value.trim();
    if (!text) return;
    try { await api('POST', '/posts/' + postId + '/comments', { text }); input.value = ''; loadComments(postId); }
    catch (e) { toast(e.message); }
  }

  async function deleteComment(postId, commentId) {
    try { await api('DELETE', '/posts/' + postId + '/comments/' + commentId); loadComments(postId); }
    catch (e) { toast(e.message); }
  }

  async function likePost(postId) {
    try { await api('POST', '/posts/' + postId + '/like'); loadPosts(); }
    catch (e) { toast(e.message); }
  }

  async function loadAdmin() {
    const grid = document.getElementById('stats-grid');
    const list = document.getElementById('users-list');
    grid.innerHTML = '<div class="loading" style="grid-column:span 2">Loading...</div>';
    list.innerHTML = '<div class="loading">Loading...</div>';
    try {
      const [stats, users] = await Promise.all([api('GET', '/admin/stats'), api('GET', '/admin/users')]);
      grid.innerHTML = `
        <div class="stat-card"><div class="stat-num">${stats.totalUsers ?? 0}</div><div class="stat-label">Users</div></div>
        <div class="stat-card"><div class="stat-num">${stats.totalPosts ?? 0}</div><div class="stat-label">Posts</div></div>
        <div class="stat-card"><div class="stat-num">${stats.totalComments ?? 0}</div><div class="stat-label">Comments</div></div>
        <div class="stat-card"><div class="stat-num">${stats.totalLikes ?? 0}</div><div class="stat-label">Likes</div></div>`;
      if (!users.length) { list.innerHTML = '<div class="empty">No users found.</div>'; return; }
      list.innerHTML = users.map(u => {
        const status = u.status || 'active';
        const badge = `<span class="badge badge-${status}">${status}</span>`;
        const actionBtn = status === 'active'
          ? `<button class="btn-danger btn-sm" onclick="setStatus('${u._id}','blocked')">Block</button>`
          : `<button class="btn-secondary btn-sm" onclick="setStatus('${u._id}','active')">Activate</button>`;
        return `<div class="user-row">
          <div class="user-info">
            <div class="user-name">${esc(u.username)}</div>
            <div class="user-role">${u.role} &middot; ${u.postCount ?? 0} posts &middot; ${u.commentCount ?? 0} comments</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">${badge}${actionBtn}</div>
        </div>`;
      }).join('');
    } catch { grid.innerHTML = '<div class="empty" style="grid-column:span 2">Could not load data.</div>'; }
  }

  async function setStatus(userId, status) {
    try { await api('PATCH', '/admin/users/' + userId + '/status', { status }); loadAdmin(); toast('User updated.'); }
    catch (e) { toast(e.message); }
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  applyAuthState();
  loadPosts();
</script>
</body>
</html>
